version: 2

updates:
  # npm は Dependabot に任せない。この雛形は bun の catalog 付き workspace を使っており、
  # Dependabot が生成する bun.lock は workspace 側の依存指定を更新しきれず、
  # CI の `bun install --frozen-lockfile` が必ず失敗する。手順は .docs/guide.md の「依存の更新」を参照。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
