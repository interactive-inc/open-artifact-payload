name: backup-d1

on:
  schedule:
    - cron: '0 15 * * 0'
  workflow_dispatch:

jobs:
  dump-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install wrangler
        run: bun add -g wrangler@~4.61
      - name: Dump D1 to file
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          timestamp=$(date +%Y%m%d)
          wrangler d1 export D1 --env=production --output="backup-$timestamp.sql" --remote
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          timestamp=$(date +%Y%m%d)
          wrangler r2 object put "inta-cms-backups/d1-backup-$timestamp.sql" --file="backup-$timestamp.sql" --remote
