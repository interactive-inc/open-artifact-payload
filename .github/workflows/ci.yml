name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAYLOAD_SECRET: ci-secret-do-not-use-in-production
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run generate:types
      - run: bun run generate:importmap
      - run: git diff --exit-code -- src/payload-types.ts cloudflare-env.d.ts 'src/app/(payload)/admin/importMap.js'

      - run: bun run test:unit
      - run: bun run test:int

      - run: bun run test:cloudflare-config

      # レジストリの一時的な接続不良で偽陽性にならないよう 3 回まで試す。3 回失敗したら本物の失敗
      # GHSA-vfj7-8cjw-p6xm (braces) は修正版が未公開のため除外する。対象は sass / micromatch 経由の
      # ビルド時の glob 展開で、パターンはコード内の固定値。修正版が出たら除外を外す
      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            if bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm; then exit 0; fi
            echo "bun audit failed (attempt $attempt)"
            sleep 30
          done
          exit 1

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bunx opennextjs-cloudflare build

      - run: bunx wrangler deploy --dry-run --strict --env=production

      - run: bun run build-storybook

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - run: bunx playwright install --with-deps chromium

      - run: bun run test:storybook:static

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-build
          path: playwright-report/
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - run: bunx playwright install --with-deps chromium

      # Worker runtime の bindings は job の環境変数を継承しないため、CI専用のダミー値を渡す。
      - name: Configure local Worker bindings
        run: |
          cat > .dev.vars <<'EOF'
          PAYLOAD_SECRET=ci-secret-do-not-use-in-production
          NEXT_PUBLIC_SERVER_URL=http://localhost:3000
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          EOF

      # Next dev の初回コンパイルとメモリ閾値による再起動をE2Eから除く。
      - run: bun run build:preview

      - run: bun run test:e2e
        env:
          E2E_SERVER: workers

      - run: bun run test:e2e:development-access

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-e2e
          path: test-results/
          retention-days: 7
