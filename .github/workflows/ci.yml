name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-int:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate types
        run: bun run generate:types
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-placeholder-secret-1234567890abcdef1234567890abcdef' }}
      - name: Lint
        run: bun run lint
      - name: Integration tests
        run: bun run test:int
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-placeholder-secret-1234567890abcdef1234567890abcdef' }}
